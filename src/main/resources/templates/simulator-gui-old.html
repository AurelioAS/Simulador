<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<title>MQ Simulator Dashboard</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
	rel="stylesheet">
</head>
<body class="bg-light">
	<div class="container py-5">
		<div class="card shadow">
			<div class="card-header bg-primary text-white">
				<h2 class="mb-0">MQ Simulator Dashboard - 2026</h2>
			</div>
			<div class="card-body">
				<div th:if="${success}" class="alert alert-success"
					th:text="${success}"></div>
				<div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
				<div class="mt-4 text-center text-muted">
					<small>Modo activo: <span
						th:text="${@simulatorProperties.role}"></span></small>
				</div>
				<form th:action="@{/gui/send}" method="post">
					<div class="row mb-3">
						<div class="col-md-5">
							<label class="form-label fw-bold">Cola de Destino:</label> <select
								name="queue" class="form-select" required>
								<option th:each="q : ${queues}" th:value="${q}" th:text="${q}"></option>
							</select>
						</div>
						<div class="col-md-5">
							<label class="form-label fw-bold">Correlación
								(Hexadecimal):</label> <input type="text" id="correlationId"
								name="correlationId" class="form-control"
								placeholder="Ej: 414243..." >
						</div>
						<div class="col-md-2 d-flex align-items-end">
							<div class="form-check mb-2">
								<input class="form-check-input" type="checkbox"
									name="copyCorrel" id="copyCorrel"> <label
									class="form-check-label" for="copyCorrel">Copy Correl</label>
							</div>
						</div>
					</div>

					<div class="mb-3">
						<label class="form-label font-weight-bold">Payload
							(Contenido):</label>
						<textarea name="payload" class="form-control" rows="4"
							placeholder='{"json": "aquí"}' required></textarea>
					</div>

					<div class="d-grid gap-2">
						<button type="submit" class="btn btn-success btn-lg">Enviar
							Mensaje a MQ</button>
						<a href="/gui" class="btn btn-outline-secondary">Limpiar
							Formulario</a>
					</div>
				</form>
			</div>
		</div>

	</div>
</body>
</html>
