# spring.profiles.active: dualrun-ger, mq-dev-ger # dualrun-ger, external-driven, master-driven
# spring.profiles.include: simu-cache # dev
server:
  port: 8089
  error:
    include-message: always
  servlet:
    session:
      tracking-modes: cookie # Evita generación innecesaria de IDs de sesión si no usas sesiones

spring.thymeleaf.cache: false
      
simu-mq:
    path: "c:/temp"
    expiry: 120     #in seconds
    ttl: 60
    debug: false
    debugAll: false

logging.config: classpath:log4j2.xml
logging.level.org.springframework.boot.context.properties: DEBUG
logging.level.org.apache.catalina: ERROR
---
# Profile to activate to connect to cert client mq
spring.config.activate.on-profile: mq-dev-ger

ibm:
  mq:
    host: mqlascgc1.sgtech.corp 
    channel: CLNT.JAVA_PRUEBA 
    queue-manager: MQLASCGC1 
    port: 1417
    user: admin
    password: password
    
---
# Profile to activate to connect to cert client mq
spring.config.activate.on-profile: mq-dev,default
      
ibm:
  mq:
    host: isblccfserd0004.scisb.isban.corp
    port: 1414
    queue-manager: MQLAB.QM
    channel: MQLAB.CH
    user: admin
    password: password
      
