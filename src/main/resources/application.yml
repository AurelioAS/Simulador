      MENSAJE_MASTER: '008700410840000077002100520810000049XA01TODO BIEN   ..................'
      RESPUESTA_EXITOSA: '{"resultado": "PROCESADO_OK", "codigo_autorizacion": "MQ-9988"}'
      MENSAJE_SECUNDARIO: '008700410840000077002100520810000049XA02FUE MAL     ..................'
      KEEP_ALIVE: '{"status": "UP"}'

#    # MATRIZ DE RESPUESTAS AUTOMÁTICAS:
#    # "Si el simulador recibe un mensaje en la llave X, responde en la llave Y con el payload Z"
  auto-responses:
      master-in:
        target-queue: "master-res"
        payload-key: "MENSAJE_MASTER"
        copy-correl: true
    
      secondary-in:
        target-queue: "secondary-res"
        payload-key: "MENSAJE_SECUNDARIO"
        copy-correl: true
  
  consumers:
    - external-res
  
  properties:
    correlation: msg-correl
