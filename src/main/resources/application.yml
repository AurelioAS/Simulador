spring.config.activate.on-profile: t3270-driven    
# -------------------------------------------------------------------
# CONFIGURACIÓN COMÚN DE COLAS Y PAYLOADS
# -------------------------------------------------------------------
simulador:
  numThreads: 1
  role: T3270_START
  # Definición de colas con su respectivo CCSID
  queues:
    master-in:
      name: "QNAME08"
      ccsid: 284 # UTF-8
#      fire:    #Dispara respuesta automática al recibir mensaje en esta cola al secundario
#        queues:
#          secondary-in:
#            payload-key: 'MENSAJE_SECUNDARIO'
#            copy-correl: true
    secondary-in:
      name: "QNAME08"
      ccsid: 284
      tresp: 50          #Millis
    external-in:
      name: "QNAME10"
      ccsid: 1208
      
  # Biblioteca de mensajes (Strings configurables)
  payloads:
    MENSAJE_MASTER: 'payload:msgT3270-1'
    RESPUESTA_EXITOSA: '{"resultado": "PROCESADO_OK", "codigo_autorizacion": "MQ-9988"}'
    MENSAJE_SECUNDARIO: 'payload:msgT3270-2'
