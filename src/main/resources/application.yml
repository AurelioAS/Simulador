# -------------------------------------------------------------------
# PERFIL: EXTERNAL-DRIVEN (El simulador actúa como sistema externo inicial)
# -------------------------------------------------------------------
spring.config.activate.on-profile: external-driven, default

simulador:
  numThreads: 10
  fire: true
  role: DR_START
  ttl: 120 # Tiempo de vida del mensaje en segundos (10 minutos)
  # Definición de colas con su respectivo CCSID
  queues:
      master-in:
        name: "QNAME08"
        ccsid: 284 # UTF-8
      master-res:
        name: "QNAME10"
        ccsid: 284
      external-request:
        name: "QNAME07"
        ccsid: 1208
      external-res:
        name: "QNAME12"
        ccsid: 819  # Ejemplo: ISO-8859-1 para el sistema externo
#        fire:
#          queues:
#            secondary-res:
#              payload-key: 'MENSAJE_SECUNDARIO'
#              copy-correl: true
      secondary-in:
        name: "QNAME09"
        ccsid: 284
      secondary-res:
        name: "QNAME11"
        ccsid: 284
        #tResp: 25

    # Biblioteca de mensajes (Strings configurables)
  payloads:
     MENSAJE_EXTERNO: ''
     MENSAJE_MASTER: '008700410840000077002100520810000049XA01TODO BIEN   ..................008700410840000077002100520810000049XA01TODO BIEN   ..................008700410840000077002100520810000049XA01TODO BIEN   ..................008700410840000077002100520810000049XA01TODO BIEN   ..................'
     RESPUESTA_EXITOSA: '{"resultado": "PROCESADO_OK", "codigo_autorizacion": "MQ-9988"}'
     MENSAJE_SECUNDARIO: '008700410840000077002100520810000049XA02FUE MAL     ..................008700410840000077002100520810000049XA02FUE MAL     ..................008700410840000077002100520810000049XA02FUE MAL     ..................008700410840000077002100520810000049XA02FUE MAL     ..................'
     KEEP_ALIVE: '{"status": "UP"}'

    # MATRIZ DE RESPUESTAS AUTOMÁTICAS:
    # "Si el simulador recibe un mensaje en la llave X, responde en la llave Y con el payload Z"
  auto-responses:
      master-in:
        target-queue: "master-res"
        payload-key: "MENSAJE_MASTER"
        copy-correl: false
    
      secondary-in:
        target-queue: "secondary-res"
        payload-key: "MENSAJE_SECUNDARIO"
        copy-correl: false
  
  consumers:
    - external-res
    
  properties:
    correlation: msg-correl    
